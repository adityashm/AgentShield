<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path
    d="M32 4 L56 14 V28 C56 44 46 54 32 60 C18 54 8 44 8 28 V14 Z"
    fill="url(#innerBg)"
    stroke="url(#shieldGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Internal Circuit Nodes -->
  <path
    d="M32 16 L44 26 V38 L32 48 L20 38 V26 Z"
    stroke="#06b6d4"
    stroke-width="1.5"
    stroke-opacity="0.6"
    stroke-dasharray="2 2"
    fill="none"
  />

  <!-- Neural Core / Agent Shield Monogram -->
  <path
    d="M32 20 L40 28 L32 38 L24 28 Z"
    fill="url(#shieldGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Connection Points (Agents) -->
  <circle cx="32" cy="14" r="2" fill="#00f2fe" />
  <circle cx="48" cy="22" r="1.75" fill="#10b981" />
  <circle cx="16" cy="22" r="1.75" fill="#10b981" />
  <circle cx="32" cy="52" r="2" fill="#10b981" />
</svg>