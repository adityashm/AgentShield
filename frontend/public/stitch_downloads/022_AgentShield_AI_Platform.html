<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>AgentShield AI - Login</title>

<style>
        body {
            background-color: #0D1117;
            background-image: 
                linear-gradient(rgba(22, 27, 34, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(22, 27, 34, 0.4) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        
        .hex-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='103.92' viewBox='0 0 60 103.92' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 17.32V51.96L30 69.28L0 51.96V17.32L30 0ZM30 34.64L45 25.98V8.66L30 -8.66L15 8.66V25.98L30 34.64Z' fill='%23a8e8ff' fill-opacity='1' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
        }
        
        .glow-effect:focus-within {
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.4);
        }
        
        .input-dark {
            background-color: #0D1117 !important;
        }
    </style>

<body class="text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="hex-bg"></div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-[420px] bg-bg-surface border border-border-subtle rounded-xl p-8 shadow-2xl">
<!-- Header -->
<div class="flex flex-col items-center mb-8">
<div class="w-12 h-12 rounded-lg bg-primary-container/10 flex items-center justify-center mb-4 border border-primary-container/30">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1; font-size: 28px;">shield</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">AgentShield AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Security Monitoring Platform</p>
</div>
<!-- Divider -->
<div class="w-full h-px bg-border-subtle mb-8"></div>
<!-- Form -->
<form class="space-y-6">
<!-- Username Input -->
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface-variant" for="username">Username</label>
<div class="relative glow-effect rounded">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-size: 18px;">person</span>
<input class="w-full pl-10 pr-3 py-2 input-dark border border-border-subtle rounded text-on-surface font-data-mono text-data-mono focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none placeholder:text-on-surface-variant/30" id="username" placeholder="Enter username" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-body-sm text-body-sm text-on-surface-variant" for="password">Password</label>
<div class="relative glow-effect rounded">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-size: 18px;">lock</span>
<input class="w-full pl-10 pr-10 py-2 input-dark border border-border-subtle rounded text-on-surface font-data-mono text-data-mono focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-border-subtle input-dark text-primary-container focus:ring-primary-container focus:ring-offset-background" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                    Remember me
                </label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded bg-primary-container text-on-primary-container font-button-label text-button-label uppercase hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container focus:ring-offset-background mt-4" type="button">
                Sign In
            </button>
</form>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-data-mono text-[10px] text-on-surface-variant/50 tracking-wider">
                AGENTSHIELD AI V1.0 — GROUP 26MPA06 — IMSEC
            </p>
</div>
</div>
</body></html>
