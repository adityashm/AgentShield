<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c172a" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Shield Emblem -->
  <g transform="translate(12, 10) scale(0.95)">
    <!-- Outer Shield Frame -->
    <path
      d="M32 4 L56 14 V28 C56 44 46 54 32 60 C18 54 8 44 8 28 V14 Z"
      fill="url(#logoBg)"
      stroke="url(#logoGrad)"
      stroke-width="2.5"
      stroke-linejoin="round"
      filter="drop-shadow(0 0 8px rgba(6, 182, 212, 0.35))"
    />

    <!-- Internal Hex Core -->
    <path
      d="M32 16 L44 26 V38 L32 48 L20 38 V26 Z"
      stroke="#06b6d4"
      stroke-width="1.5"
      stroke-opacity="0.6"
      stroke-dasharray="2 2"
      fill="none"
    />

    <!-- Center Agent Diamond -->
    <path
      d="M32 20 L40 28 L32 38 L24 28 Z"
      fill="url(#logoGrad)"
      filter="url(#logoGlow)"
    />

    <!-- Sensor Nodes -->
    <circle cx="32" cy="14" r="2.2" fill="#00f2fe" />
    <circle cx="48" cy="22" r="1.8" fill="#10b981" />
    <circle cx="16" cy="22" r="1.8" fill="#10b981" />
    <circle cx="32" cy="52" r="2.2" fill="#10b981" />
  </g>

  <!-- Brand Typography -->
  <text x="82" y="38" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="0.08em">
    AGENT<tspan fill="url(#logoGrad)">SHIELD</tspan>
  </text>
  
  <text x="83" y="55" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="9.5" fill="#06b6d4" letter-spacing="0.25em" opacity="0.9">
    AI RUNTIME DEFENSE
  </text>
</svg>