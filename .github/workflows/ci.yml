name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install greenlet
          pip install -r backend/requirements.txt
          pip install pytest-cov pytest-asyncio

      - name: Run Backend Tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v --cov=app

  sdk-test:
    name: SDK Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK with Extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk/python[all,dev]"
          pip install pytest pytest-asyncio pytest-cov httpx requests

      - name: Run SDK Tests
        env:
          PYTHONPATH: sdk/python/src
        run: |
          python -m pytest sdk/python/tests/ -v --cov=agentshield

  frontend-build:
    name: Frontend Build (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
